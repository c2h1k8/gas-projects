<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <!-- 処理中のローディング表示。処理側は LoadingUi.js（使い方もそちらに書いてある） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --soft: #f9fafb;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --ok: #059669;
      --ok-soft: #ecfdf5;
      --ng: #dc2626;
      --ng-soft: #fef2f2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: 'Noto Sans JP', system-ui, sans-serif; color: var(--ink); background: #fff; font-size: 13px; }
    .wrap { display: flex; flex-direction: column; height: 100%; padding: 20px 22px 16px; gap: 14px; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { font-size: 16px; font-weight: 700; margin: 0; }
    .elapsed { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }

    .now { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center; }
    .badge { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .8s linear infinite; position: relative; }
    .isComplete .badge { animation: none; border-color: var(--ok); background: var(--ok); }
    .isComplete .badge::after { content: ''; position: absolute; left: 5px; top: 1px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
    .isError .badge { animation: none; border-color: var(--ng); background: var(--ng); }
    .isError .badge::before, .isError .badge::after { content: ''; position: absolute; left: 7px; top: 2px; width: 2px; height: 12px; background: #fff; }
    .isError .badge::before { transform: rotate(45deg); }
    .isError .badge::after { transform: rotate(-45deg); }
    .hint { font-size: 14px; font-weight: 500; line-height: 1.5; word-break: break-all; }
    .isComplete .hint { color: #065f46; }
    .isError .hint { color: #991b1b; }

    .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; position: relative; }
    .bar > span { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: inherit; transition: width .35s ease; }
    /* 件数が分からない間は、進み続けていることだけを見せる */
    .bar.isIndeterminate > span { width: 35%; animation: slide 1.3s ease-in-out infinite; }
    .isComplete .bar > span { width: 100% !important; background: var(--ok); animation: none; }
    .isError .bar > span { width: 100% !important; background: var(--ng); animation: none; }
    .count { color: var(--muted); font-size: 11px; margin-top: -8px; text-align: right; font-variant-numeric: tabular-nums; min-height: 14px; }

    .log { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
    .log li { display: grid; grid-template-columns: 16px 1fr auto; gap: 8px; align-items: start; padding: 6px 2px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .log li::before { content: ''; width: 10px; height: 6px; margin-top: 4px; border: solid var(--ok); border-width: 0 0 2px 2px; transform: rotate(-45deg); }
    .log .t { font-variant-numeric: tabular-nums; font-size: 11px; }
    .empty { color: var(--muted); font-size: 12px; padding: 8px 2px; }
    .log li.empty::before { display: none; }

    footer { display: flex; justify-content: flex-end; gap: 8px; min-height: 36px; }
    button { font: inherit; font-weight: 500; border-radius: 8px; padding: 8px 14px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    button:hover { background: #4338ca; }
    [hidden] { display: none !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes slide { 0% { left: -35%; } 100% { left: 100%; } }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <header>
      <h1 id="title">処理中</h1>
      <span class="elapsed" id="elapsed">00:00</span>
    </header>
    <div class="now">
      <span class="badge"></span>
      <div class="hint" id="hint">処理中…</div>
    </div>
    <div class="bar isIndeterminate" id="bar"><span></span></div>
    <div class="count" id="count"></div>
    <ul class="log" id="log"></ul>
    <footer id="footer"></footer>
  </div>

  <script>
    (function () {
      const $ = (id) => document.getElementById(id);
      const fmt = (ms) => {
        const s = Math.max(0, Math.floor(ms / 1000));
        return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      };

      let startedAt = Date.now();
      let finished = false;
      let pollTimer = null;
      let closeTimer = null;
      let lastHistoryLen = -1;

      const clock = setInterval(() => { $('elapsed').textContent = fmt(Date.now() - startedAt); }, 250);
      const close = () => google.script.host.close();

      const renderLog = (history) => {
        if (history.length === lastHistoryLen) return;
        lastHistoryLen = history.length;
        const log = $('log');
        log.innerHTML = '';
        // 新しい作業を上に出す
        history.slice().reverse().forEach((h) => {
          const li = document.createElement('li');
          const text = document.createElement('span');
          text.textContent = h.text;
          const t = document.createElement('span');
          t.className = 't';
          t.textContent = fmt(h.at - startedAt);
          li.append(text, t);
          log.appendChild(li);
        });
      };

      const showClose = (autoClose, delayMs) => {
        const f = $('footer');
        f.innerHTML = '';
        const btn = document.createElement('button');
        btn.textContent = '閉じる';
        btn.addEventListener('click', close);
        f.appendChild(btn);
        if (!autoClose) return;
        // 結果を読めるよう少し見せてから閉じる（マウスを動かしたら止める）
        let left = Math.max(1, Math.round(delayMs / 1000));
        const tick = () => {
          btn.textContent = `閉じる（${left}）`;
          if (left-- <= 0) return close();
          closeTimer = setTimeout(tick, 1000);
        };
        tick();
        document.addEventListener('mousemove', () => {
          clearTimeout(closeTimer);
          btn.textContent = '閉じる';
        }, { once: true });
      };

      const apply = (state) => {
        if (!state || state.status === 'idle') return;
        if (state.startedAt) startedAt = state.startedAt;
        if (state.title) $('title').textContent = state.title;
        if (state.hint) $('hint').textContent = state.hint;

        const hasCount = typeof state.total === 'number' && state.total > 0;
        $('bar').classList.toggle('isIndeterminate', !hasCount);
        $('bar').firstElementChild.style.width = hasCount ? `${Math.round((state.current / state.total) * 100)}%` : '';
        $('count').textContent = hasCount ? `${state.current} / ${state.total}` : '';

        renderLog(state.history || []);
        if (!(state.history || []).length && state.status === 'loading') {
          $('log').innerHTML = '<li class="empty" style="display:block">（終わった作業がここに並びます）</li>';
        }

        if (finished) return;
        if (state.status === 'complete') {
          finished = true;
          $('root').classList.add('isComplete');
          $('title').textContent = state.title || '完了';
          stop();
          showClose(state.autoClose !== false, state.closeDelayMs || 1800);
        } else if (state.status === 'error') {
          finished = true;
          $('root').classList.add('isError');
          $('title').textContent = '失敗しました';
          stop();
          showClose(false); // 理由を読めるよう閉じずに残す
        }
      };

      const stop = () => {
        clearInterval(clock);
        clearTimeout(pollTimer);
      };

      // 前の読み取りが返ってから次を呼ぶ（呼び出しを重ねない）
      const poll = () => {
        if (typeof google === 'undefined' || !google.script) return;
        google.script.run
          .withSuccessHandler((s) => { apply(s); if (!finished) pollTimer = setTimeout(poll, 400); })
          .withFailureHandler(() => { if (!finished) pollTimer = setTimeout(poll, 1000); })
          .LoadingUi_getStateForClient();
      };
      poll();
    })();
  </script>
</body>
</html>
